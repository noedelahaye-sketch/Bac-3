<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des 4 dossiers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7E9E3; --card:#F4F5F1; --ink:#12171A; --muted:#6C736E;
    --line:#CBCFC6; --signal:#2440C7; --alert:#B23A18; --r:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);}
  .app{
    font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink); max-width:820px; margin:0 auto; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  h1,h2,.num,.bignum{font-family:"Archivo",-apple-system,sans-serif;font-weight:800;letter-spacing:-0.02em;margin:0;}
  h1{font-size:26px;line-height:1.1;margin-bottom:16px;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px;}

  /* nav */
  .navbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);}
  .navin{max-width:820px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;}
  .navin::-webkit-scrollbar{display:none;}
  .navb{
    flex:0 0 auto;border:0;background:none;color:var(--muted);cursor:pointer;
    font:600 13px "Instrument Sans",sans-serif;padding:8px 13px;border-radius:8px;white-space:nowrap;
    display:flex;align-items:center;gap:6px;
  }
  .navb:hover{background:#DDE0D8;}
  .navb.on{background:var(--ink);color:var(--card);}
  .navb i{font-style:normal;font-size:10.5px;font-weight:700;background:var(--signal);color:#fff;border-radius:20px;padding:1px 6px;}
  .navb.on i{background:var(--card);color:var(--ink);}
  main{padding:20px 16px 56px;}

  .cadence{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:14px;}
  .verdict{font-family:"Archivo",sans-serif;font-weight:800;font-size:19px;letter-spacing:-0.02em;line-height:1.2;}
  .verdict.late{color:var(--alert);} .verdict.ok{color:var(--signal);}
  .sub{font-size:13px;color:var(--muted);margin-top:5px;}
  .ticks{display:flex;gap:2px;margin:16px 0 8px;align-items:flex-end;height:34px;}
  .tick{flex:1;height:22px;background:#D5D9D0;border-radius:2px;}
  .tick.done{background:var(--signal);} .tick.wip{background:#9AA8E8;}
  .tick.mark{position:relative;}
  .tick.mark::after{content:"";position:absolute;left:-2px;top:-9px;bottom:-9px;width:2px;background:var(--alert);border-radius:1px;}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);flex-wrap:wrap;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .dot{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap;}
  .stat .num{font-size:30px;line-height:1;}
  .num .on,.bignum .on{font-size:15px;color:var(--muted);font-weight:600;}
  .stat .lbl,.mini .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-top:4px;font-weight:600;}

  .next{background:var(--ink);color:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;}
  .next .eyebrow{color:#98A09B;}
  .next .t{font-family:"Archivo",sans-serif;font-weight:600;font-size:16px;letter-spacing:-0.01em;}
  .next button{margin-top:12px;background:var(--card);color:var(--ink);border:0;padding:9px 14px;border-radius:7px;font:600 13px "Instrument Sans",sans-serif;cursor:pointer;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;}
  .mini:hover{border-color:var(--signal);}
  .bignum{font-size:30px;line-height:1;margin-top:3px;}

  .panel{margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;}
  .panel.accent{border-color:#B8C2EE;}
  .phead{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;background:none;border:0;width:100%;text-align:left;font-family:inherit;}
  .phead h2{font-size:15px;flex:1;letter-spacing:-0.01em;}
  .phead .cas{font-size:12px;color:var(--muted);font-weight:400;font-family:"Instrument Sans",sans-serif;letter-spacing:0;display:block;margin-top:2px;}
  .count{font:600 12px "Instrument Sans",sans-serif;color:var(--muted);white-space:nowrap;}
  .chev{color:var(--muted);font-size:12px;transition:transform .18s;}
  .panel.open .chev{transform:rotate(90deg);}
  .pbody{display:none;border-top:1px solid var(--line);padding:14px 15px 18px;}
  .panel.open .pbody,.panel.open .qlist{display:block;}
  .qlist{display:none;border-top:1px solid var(--line);}

  .q{border-bottom:1px solid var(--line);} .q:last-child{border-bottom:0;}
  .qhead{display:flex;align-items:center;gap:11px;padding:11px 15px;cursor:pointer;background:none;border:0;width:100%;text-align:left;font-family:inherit;font-size:14px;}
  .qhead:hover{background:#EDEEE9;}
  .qn{font:600 11px "Instrument Sans",sans-serif;color:var(--muted);min-width:34px;}
  .qt{flex:1;line-height:1.3;}
  .chip{font:600 10px "Instrument Sans",sans-serif;text-transform:uppercase;letter-spacing:.07em;padding:3px 7px;border-radius:20px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);}
  .chip.wip{background:#E3E7F9;border-color:#B8C2EE;color:#2440C7;}
  .chip.draft{background:var(--signal);border-color:var(--signal);color:#fff;}
  .chip.done{background:var(--ink);border-color:var(--ink);color:#fff;}
  .qbody{display:none;padding:2px 15px 16px;} .q.open .qbody{display:block;}

  .lab{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin:14px 0 7px;}
  .lab:first-child{margin-top:8px;}
  .crit{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin-bottom:7px;cursor:pointer;line-height:1.35;}
  .crit input{margin:3px 0 0;accent-color:var(--signal);width:15px;height:15px;flex-shrink:0;}
  .states{display:flex;gap:6px;flex-wrap:wrap;}
  .states button{font:600 12px "Instrument Sans",sans-serif;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;}
  .states button:hover:not(:disabled){border-color:var(--signal);color:var(--ink);}
  .states button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);}
  .states button:disabled{opacity:.5;cursor:default;}
  .states button em{font-style:normal;color:var(--muted);font-weight:400;}

  ul.att{margin:0;padding-left:19px;font-size:13.5px;line-height:1.45;} ul.att li{margin-bottom:6px;}
  details.notions{margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:10px 12px;}
  details.notions summary{cursor:pointer;font:600 12px "Instrument Sans",sans-serif;color:var(--signal);text-transform:uppercase;letter-spacing:.08em;}
  details.notions ul{margin:10px 0 0;padding-left:18px;font-size:13px;line-height:1.45;} details.notions li{margin-bottom:7px;}
  .rappel{margin:12px 0 0;font-size:12px;color:var(--muted);font-style:italic;line-height:1.45;}
  .intro{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.5;}

  .trame{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 13px;font-size:13px;line-height:1.5;}
  .trame p{margin:0 0 9px;} .trame ol{margin:0;padding-left:19px;} .trame li{margin-bottom:9px;}
  .trame .pistes{color:var(--muted);font-size:12.5px;display:block;margin-top:2px;}
  .trame details{margin-top:10px;border-top:1px solid var(--line);padding-top:9px;}
  .trame summary{cursor:pointer;font-weight:600;font-size:12.5px;color:var(--signal);}
  .trame details div{margin-top:8px;font-size:12.5px;color:var(--muted);}
  .trame details div b{color:var(--ink);}

  .memo{font-size:13.5px;line-height:1.55;}
  .memo p{margin:0 0 11px;} .memo p:last-child{margin-bottom:0;}
  .memo b{font-weight:600;}
  .memo .piege{background:var(--paper);border-left:2px solid var(--alert);padding:9px 12px;border-radius:0 6px 6px 0;font-size:13px;}

  textarea.f,input.f{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font:400 13px "Instrument Sans",sans-serif;background:var(--paper);color:var(--ink);}
  textarea.f{resize:vertical;min-height:44px;line-height:1.45;} textarea.big{min-height:150px;}
  textarea.f:focus,input.f:focus{outline:2px solid var(--signal);outline-offset:-1px;}
  .fiche .row{margin-bottom:11px;}
  .fiche .k{font-size:12px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;}
  .fiche .k em{font-style:normal;color:var(--muted);font-weight:400;font-size:11px;}
  .given{background:var(--paper);border:1px dashed var(--line);border-radius:7px;padding:10px 12px;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:12px;}
  .given b{color:var(--ink);font-weight:600;}
  .jform{display:grid;gap:8px;margin-bottom:14px;}
  .jadd{background:var(--ink);color:var(--card);border:0;padding:9px 14px;border-radius:7px;font:600 13px "Instrument Sans",sans-serif;cursor:pointer;justify-self:start;}
  .jentry{border-top:1px solid var(--line);padding:11px 0 3px;font-size:13px;line-height:1.5;position:relative;}
  .jentry .meta{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:4px;}
  .jentry .del{position:absolute;right:0;top:9px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 4px;}
  .empty{color:var(--muted);font-size:13px;font-style:italic;}

  .prog{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:10px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:20px 17px;}
  .cq{font-family:"Archivo",sans-serif;font-weight:600;font-size:17px;line-height:1.3;letter-spacing:-0.01em;}
  .ca{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;line-height:1.5;}
  .reveal{margin-top:16px;background:var(--ink);color:var(--card);border:0;padding:12px 16px;border-radius:8px;font:600 13px "Instrument Sans",sans-serif;cursor:pointer;width:100%;}
  .cbtns{display:flex;gap:8px;margin-top:16px;}
  .cbtns button{flex:1;border:0;padding:12px;border-radius:8px;font:600 13px "Instrument Sans",sans-serif;cursor:pointer;}
  .cbtns .no{background:#E8D5CE;color:#8A2C10;} .cbtns .yes{background:var(--signal);color:#fff;}
  .fref{margin-top:12px;}
  .linkf{background:none;border:0;color:var(--signal);font:500 12px "Instrument Sans",sans-serif;cursor:pointer;padding:0;text-decoration:underline;}
  .quit{margin-top:12px;background:none;border:0;color:var(--muted);font:500 12px "Instrument Sans",sans-serif;cursor:pointer;text-decoration:underline;padding:4px 0;}
  .opts{display:grid;gap:7px;margin-top:15px;}
  .opt{text-align:left;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:400 13.5px "Instrument Sans",sans-serif;color:var(--ink);cursor:pointer;line-height:1.35;}
  .opt:hover:not(:disabled){border-color:var(--signal);}
  .opt.good{background:#DCE5F7;border-color:var(--signal);font-weight:600;}
  .opt.bad{background:#F0DDD6;border-color:#C97A5C;}
  .opt:disabled{cursor:default;}
  .expl{margin-top:13px;font-size:13px;color:var(--muted);line-height:1.45;border-left:2px solid var(--line);padding-left:11px;}
  .done-msg{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:18px;font-size:15px;margin-bottom:14px;}
  .done-msg b{font-family:"Archivo",sans-serif;font-weight:800;}
  .hrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);}
  .hrow b{color:var(--ink);font-family:"Archivo",sans-serif;font-weight:600;}

  .foot{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.6;}
  .foot input{font:400 12px "Instrument Sans",sans-serif;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--card);color:var(--ink);}
  .foot button{font:600 12px "Instrument Sans",sans-serif;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--card);color:var(--ink);cursor:pointer;margin-top:8px;}

  @media (max-width:520px){
    h1{font-size:22px;} .stat .num,.bignum{font-size:25px;} .stats{gap:16px;} .ticks{gap:1px;}
    .grid2{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="app">
  <nav class="navbar"><div class="navin" id="nav"></div></nav>
  <main id="main"></main>
</div>
<script>
(function(){
  var START = new Date(2026,6,30);
  var DEFAULT_DEADLINE = "2026-12-01";
  var KEY = "studi-suivi-v1";

  var TRAME_B1Q1 =
    '<p>Le libellé de la compétence C1.1 nomme <b>six types de veille</b>. Ce sont les six lignes de ton tableau.</p>'+
    '<p>Pour chacune, renseigne les six champs&nbsp;: <b>décision éclairée</b> · <b>questions auxquelles répondre</b> · <b>périmètre</b> (géographique et temporel) · <b>sources et outils</b> · <b>fréquence</b> · <b>livrable</b>.</p>'+
    '<ol>'+
    '<li><b>Veille marketing</b><span class="pistes">Attentes des familles pour un hébergement thématique en parc, écart entre l\'offre concurrente et les attentes exprimées.</span></li>'+
    '<li><b>Veille commerciale</b><span class="pistes">Politiques tarifaires et packages des concurrents, taux d\'occupation du secteur, poids des plateformes de distribution face à la vente directe, saisonnalité.</span></li>'+
    '<li><b>Veille technologique</b><span class="pistes">Systèmes de réservation et de gestion hôtelière, conciergerie digitale et check-in mobile, domotique et gestion énergétique, accessibilité numérique.</span></li>'+
    '<li><b>Veille réglementaire</b><span class="pistes">Classement hôtelier en Région flamande, sécurité incendie, accessibilité PMR (8 chambres minimum, norme EN 301549), Code du tourisme, RGPD, réglementation environnementale de la construction.</span></li>'+
    '<li><b>Tendances comportementales</b><span class="pistes">Séjours courts de 1 à 2 nuits, tourisme expérientiel, arbitrages budgétaires des familles, poids des avis en ligne, visiteurs transfrontaliers.</span></li>'+
    '<li><b>Veille RSE</b><span class="pistes">Labels environnementaux de l\'hébergement, attentes réelles en tourisme durable, circuits courts, exigences du groupe Compagnie des Alpes.</span></li>'+
    '</ol>'+
    '<details><summary>Voir une ligne remplie en modèle</summary><div>'+
    '<b>Veille marketing — décision éclairée&nbsp;:</b> cerner les attentes des familles en matière d\'hébergement thématique intégré à un parc, afin d\'arbitrer la répartition des typologies de chambres et le contenu de l\'offre de séjour.<br><br>'+
    '<b>Questions&nbsp;:</b> que recherchent les familles dans un séjour de 1 à 2 nuits en parc&nbsp;? Quels services déclenchent concrètement la réservation&nbsp;? Quel écart entre l\'offre des concurrents et les attentes exprimées&nbsp;?<br><br>'+
    '<b>Périmètre&nbsp;:</b> Belgique et nord de la France dans un rayon de 150 km, plus les parcs européens comparables&nbsp;; données 2023 à 2026.<br><br>'+
    '<b>Sources et outils&nbsp;:</b> avis clients des hôtels de parcs concurrents (Booking, TripAdvisor, Google)&nbsp;; études des instituts (Statbel, Toerisme Vlaanderen, Eurostat)&nbsp;; rapports annuels de la Compagnie des Alpes&nbsp;; presse spécialisée hôtellerie et tourisme&nbsp;; agrégateur de contenu type Feedly.<br><br>'+
    '<b>Fréquence&nbsp;:</b> mensuelle pendant les 6 mois d\'étude de faisabilité. <b>Livrable&nbsp;:</b> note de synthèse de 2 pages au comité de projet.'+
    '</div></details>'+
    '<details><summary>Deux réflexes avant de rédiger</summary><div>'+
    '<b>Oriente ta veille vers la suite.</b> Tes objectifs doivent servir les questions 2 à 10. Une veille bien cadrée ici te fournit la matière de trois autres réponses.<br><br>'+
    '<b>Nomme les sources précisément.</b> «&nbsp;Faire une veille sur internet&nbsp;» ne coche aucun critère. «&nbsp;Consulter les données de Toerisme Vlaanderen et les avis Booking des hôtels de Plopsaland et Pairi Daiza&nbsp;» coche les deux.'+
    '</div></details>';

  var FICHE_B1 = [
    ["segments","Segments identifiés","Q5"],
    ["prio","Segments retenus comme prioritaires","Q6"],
    ["p1","Persona 1","Q5"],
    ["p2","Persona 2","Q5"],
    ["p3","Persona 3","Q5"],
    ["posi","Positionnement en une phrase","Q7 · Q9"],
    ["diff","Différenciateurs retenus (3 max)","Q7"],
    ["axes","Axes stratégiques retenus","Q9"],
    ["compl","Produit ou service complémentaire","Q10"]
  ];

  var BLOCS = [
    { id:"b1", code:"Bloc 1", titre:"Élaboration d'une stratégie", cas:"Bellewaerde — hôtel « Le Royaume de Léo »", qs:[
      {n:"Q1", c:"C1.1", t:"Objectifs de veille, outils et sources", trame:TRAME_B1Q1, k:["Les objectifs délimitent clairement le périmètre de recherche","Les sources et outils cités sont précis et fiables"]},
      {n:"Q2", c:"C1.1", t:"Concurrents directs, indirects et de substitution", k:["Les trois types de concurrents sont identifiés","Forces et faiblesses comparées à celles de Bellewaerde"]},
      {n:"Q3", c:"C1.1", t:"Opportunités et menaces du projet hôtelier", k:["Les informations à impact direct sur la stratégie ressortent","Menaces et opportunités explicitées avec exemples sourcés"]},
      {n:"Q4", c:"C1.2", t:"Recueil de données clients et conformité", k:["Modalités de recueil utiles et fiables","Processus conforme au RGPD : consentement, protection"]},
      {n:"Q5", c:"C1.2", t:"Segmentation et trois profils types", k:["Zones géographiques pertinentes prises en compte","Critères sociodémographiques, psychographiques et comportementaux","Personas détaillés : motivations, objectifs, comportements, besoins"]},
      {n:"Q6", c:"C1.3", t:"Segments prioritaires et justification", k:["Segmentation et ciblage explicités, priorités argumentées","Adéquation de l'offre démontrée par les données de marché"]},
      {n:"Q7", c:"C1.3", t:"Différenciateurs et expérience inclusive", k:["Valeur ajoutée mesurable face à la concurrence","Expérience pensée pour la diversité des publics"]},
      {n:"Q8", c:"C1.3", t:"Écoresponsabilité et innovations durables", k:["Durabilité intégrée : matériaux, économie circulaire, pratiques"]},
      {n:"Q9", c:"C1.4", t:"Enjeux, objectifs et axes stratégiques", k:["Enjeux et objectifs globaux identifiés et explicités","Axes alignés sur le marché et les besoins du public cible"]},
      {n:"Q10", c:"C1.4", t:"Mix marketing et service complémentaire", k:["4P cohérents avec la segmentation et le positionnement","Différenciation, innovation et attentes RSE intégrées"]},
      {n:"Vidéo", c:"—", t:"Vidéo de présentation de la stratégie", k:["Présente la démarche de réflexion, pas seulement le résultat","S'appuie sur le journal d'arbitrages tenu au fil de l'eau"]}
    ]},
    { id:"b2", code:"Bloc 2", titre:"Déploiement des actions", cas:"Bambu Lab — imprimante 3D H2S", qs:[
      {n:"Q1", c:"C2.1", t:"Plan de prospection en tableau", k:["Tableau prospects / lieux / supports","Objectifs opérationnels SMART"]},
      {n:"Q2", c:"C2.1", t:"Personas interlocuteur et utilisateur final", k:["Ciblage précis appuyé sur des critères sourcés"]},
      {n:"Q3", c:"C2.1", t:"Deux actions marketing ciblées", k:["Actions cohérentes avec le marché, les objectifs et le positionnement"]},
      {n:"Q4", c:"C2.1", t:"Budget d'une des actions", k:["Budget réaliste tenant dans l'enveloppe pilote de 20 000 €"]},
      {n:"Q5", c:"C2.1", t:"KPI de mesure d'impact", k:["Indicateurs permettant d'évaluer efficacement les actions"]},
      {n:"Q6", c:"C2.2", t:"Cahier des charges et appel d'offres", k:["Entreprise, prestation, exigences, contraintes, conditions contractuelles","Conforme au droit des contrats, des affaires et de la concurrence"]},
      {n:"Q7", c:"C2.2", t:"Grille d'évaluation des prestataires", k:["Critères alignés sur les besoins, les objectifs et les valeurs, RSE incluse"]},
      {n:"Q8", c:"C2.2", t:"Plan de négociation", k:["Objectifs mesurables, concessions, arguments, réponses aux objections","Conforme à la réglementation applicable"]},
      {n:"Q9", c:"C2.3", t:"Message publicitaire et action de diffusion", k:["Objectifs SMART","Ton adapté aux codes de l'audience","Messages inclusifs","Canaux et calendrier appropriés"]},

ois stratégies de ciblage ?", "a": "Indifférenciée (une offre pour tous), différenciée (une offre par segment), concentrée (tout sur un segment).", "t": "Segmentation", "f": 3}, {"i": 11, "q": "Comment se formule un positionnement ?", "a": "Pour [cible], [marque] est le [catégorie] qui [bénéfice différenciant], parce que [preuve].", "t": "Segmentation", "f": 3}, {"i": 12, "q": "Que doit contenir un persona pour être exploitable ?", "a": "Situation, comportement, et surtout ses motivations et ses freins. Sans besoin ni frein, ce n'est qu'une fiche d'identité.", "t": "Personas", "f": 4}, {"i": 13, "q": "Pourquoi faut-il deux personas en BtoB ?", "a": "Le décideur (qui signe, cherche à sécuriser l'investissement) et l'utilisateur final (qui s'en sert, cherche simplicité et performance) n'ont ni les mêmes critères ni les mêmes objections.", "t": "Personas", "f": 4}, {"i": 14, "q": "Quels sont les cinq rôles du centre de décision en BtoB ?", "a": "Prescripteur, décideur, acheteur, utilisateur, filtre.", "t": "Personas", "f": 4}, {"i": 15, "q": "Dans un SWOT, qu'est-ce qui est interne et qu'est-ce qui est externe ?", "a": "Forces et faiblesses sont internes ; opportunités et menaces sont externes — elles existent qu'on le veuille ou non.", "t": "Diagnostic", "f": 5}, {"i": 16, "q": "Que recouvre PESTEL ?", "a": "Politique, Économique, Socioculturel, Technologique, Écologique, Légal.", "t": "Diagnostic", "f": 5}, {"i": 17, "q": "Quels sont les 4P du mix marketing ?", "a": "Produit, Prix, Place (distribution), Promotion (communication).", "t": "Mix", "f": 6}, {"i": 18, "q": "Quels sont les 3P supplémentaires du mix des services ?", "a": "Personnel, Processus, Preuve physique.", "t": "Mix", "f": 6}, {"i": 19, "q": "Quelles sont les trois méthodes de fixation du prix ?", "a": "Par les coûts (coût de revient + marge), par la demande (ce que le client accepte de payer), par la concurrence (alignement, pénétration, écrémage).", "t": "Mix", "f": 6}, {"i": 20, "q": "Quels sont les six principes du RGPD à citer ?", "a": "Base légale, finalité déterminée, minimisation, durée limitée, sécurité, droits des personnes.", "t": "RGPD", "f": 7}, {"i": 21, "q": "Quelles sont les quatre qualités d'un consentement valable ?", "a": "Libre, spécifique, éclairé, univoque.", "t": "RGPD", "f": 7}, {"i": 22, "q": "Quelle différence entre anonymisation et pseudonymisation ?", "a": "Anonymisées, les données ne permettent plus jamais de réidentifier et sortent du RGPD. Pseudonymisées, la réidentification reste possible via une clé : elles y restent soumises.", "t": "RGPD", "f": 7}, {"i": 23, "q": "Quelles sont les bases légales possibles d'un traitement ?", "a": "Consentement, contrat, obligation légale, intérêt légitime.", "t": "RGPD", "f": 7}, {"i": 24, "q": "Que faut-il pour poser des cookies analytics ou des heatmaps ?", "a": "Un consentement préalable, avec un refus aussi simple que l'acceptation.", "t": "RGPD", "f": 7}, {"i": 25, "q": "Quels sont les trois niveaux de KPI ?", "a": "Moyens (ce qu'on déploie), résultats (ce qu'on obtient), impact (l'effet réel).", "t": "KPI", "f": 8}, {"i": 26, "q": "Quels sont les cinq éléments d'un KPI bien posé ?", "a": "Son nom, sa formule de calcul, sa source de données, sa fréquence de relevé, sa valeur cible.", "t": "KPI", "f": 8}, {"i": 27, "q": "Comment calcule-t-on le NPS ?", "a": "% de promoteurs (notes 9-10) − % de détracteurs (notes 0-6). Les passifs (7-8) sont ignorés.", "t": "KPI", "f": 8}, {"i": 28, "q": "Comment calcule-t-on le ROI ?", "a": "(gain − coût) ÷ coût.", "t": "KPI", "f": 8}, {"i": 29, "q": "Comment calcule-t-on le ROAS ?", "a": "Chiffre d'affaires généré ÷ dépense publicitaire.", "t": "KPI", "f": 8}, {"i": 30, "q": "Comment calcule-t-on un taux de conversion ?", "a": "Nombre de clients ÷ nombre de visiteurs.", "t": "KPI", "f": 8}, {"i": 31, "q": "Comment calcule-t-on un taux de réachat ?", "a": "Clients ayant acheté au moins deux fois ÷ nombre total de clients.", "t": "KPI", "f": 8}, {"i": 32, "q": "Qu'est-ce qu'un indicateur de vanité ?", "a": "Un indicateur flatteur qui ne mesure pas l'objectif — le nombre d'abonnés quand l'objectif est de vendre.", "t": "KPI", "f": 8}, {"i": 33, "q": "Quelles sont les trois familles de ressources d'un budget ?", "a": "Humaines (jours-homme × coût journalier), techniques (matériel, logiciels, licences), financières (achat d'espace, impression, déplacements).", "t": "Budget", "f": 9}, {"i": 34, "q": "Quel poste est le plus souvent oublié dans un budget marketing ?", "a": "Le temps humain — c'est pourtant presque toujours le premier poste de coût.", "t": "Budget", "f": 9}, {"i": 35, "q": "Que décrit un cahier des charges : le besoin ou la solution ?", "a": "Le besoin. Décrire la solution technique empêche les candidats de proposer mieux.", "t": "Achats", "f": 10}, {"i": 36, "q": "Quelle différence entre obligation de moyens et obligation de résultat ?", "a": "Moyens : le prestataire s'engage à tout mettre en œuvre. Résultat : il s'engage sur le résultat lui-même.", "t": "Achats", "f": 10}, {"i": 37, "q": "Quelles clauses contractuelles citer dans un cahier des charges ?", "a": "Objet, durée, prix et paiement, propriété intellectuelle, confidentialité, responsabilité et assurances, pénalités de retard, résiliation, droit applicable.", "t": "Achats", "f": 10}, {"i": 38, "q": "Qu'impose le droit de la concurrence dans un appel d'offres ?", "a": "L'égalité de traitement : mêmes informations, mêmes délais, critères annoncés à l'avance pour tous les candidats.", "t": "Achats", "f": 10}, {"i": 39, "q": "Comment construit-on une grille d'évaluation de prestataires ?", "a": "Critères en lignes avec un coefficient (total 100), note de chaque candidat, multiplication, addition, classement.", "t": "Achats", "f": 11}, {"i": 40, "q": "Quel piège guette une grille où le prix pèse 60 % ?", "a": "Elle contredit un positionnement premium : la pondération doit refléter la stratégie.", "t": "Achats", "f": 11}, {"i": 41, "q": "Que faut-il définir avant toute négociation ?", "a": "L'objectif cible, l'objectif plancher, et la solution de repli si ça échoue.", "t": "Négociation", "f": 12}, {"i": 42, "q": "Qu'est-ce que la zone d'accord possible ?", "a": "L'espace situé entre les objectifs plancher des deux parties.", "t": "Négociation", "f": 12}, {"i": 43, "q": "Que signifie la méthode CAB ?", "a": "Caractéristique (le fait) → Avantage (ce que ça permet) → Bénéfice (ce que ça apporte à cet interlocuteur précis).", "t": "Négociation", "f": 12}, {"i": 44, "q": "Quelles sont les cinq étapes du traitement d'une objection ?", "a": "Écouter sans couper → reformuler → isoler → répondre avec une preuve → verrouiller.", "t": "Négociation", "f": 12}, {"i": 45, "q": "Quelle est la règle d'or de la concession ?", "a": "Toute concession appelle une contrepartie : une remise contre un engagement de volume, un délai contre un acompte.", "t": "Négociation", "f": 12}, {"i": 46, "q": "Quelles sont les six questions d'un plan de communication ?", "a": "Quels objectifs, quelles cibles, quels messages clés, quels canaux, quel calendrier, quel budget.", "t": "Communication", "f": 13}, {"i": 47, "q": "Quels sont les trois niveaux d'objectifs de communication ?", "a": "Cognitif (faire connaître), affectif (faire aimer), conatif (faire agir).", "t": "Communication", "f": 13}, {"i": 48, "q": "Quelle est la structure d'un message publicitaire ?", "a": "Accroche → promesse → preuve → appel à l'action.", "t": "Communication", "f": 13}, {"i": 49, "q": "Quelle différence entre media et hors media ?", "a": "Media : achat d'espace (presse, affichage, radio, digital). Hors media : relations presse, événementiel, marketing direct, partenariats.", "t": "Communication", "f": 13}, {"i": 50, "q": "Quelle différence entre inclusion et accessibilité ?", "a": "L'inclusion porte sur la représentation (montrer la diversité réelle). L'accessibilité porte sur l'usage effectif (pouvoir s'en servir).", "t": "Inclusion", "f": 14}, {"i": 51, "q": "Quelles sont les cinq dimensions de l'accessibilité ?", "a": "Visuelle, auditive, motrice, cognitive, économique.", "t": "Inclusion", "f": 14}, {"i": 52, "q": "Citez trois mesures d'accessibilité visuelle.", "a": "Contraste suffisant, taille de texte adaptée, information jamais portée par la couleur seule, texte alternatif sur les images.", "t": "Inclusion", "f": 14}, {"i": 53, "q": "Que protège le droit d'auteur, et à partir de quand ?", "a": "Toute création originale, dès sa création, sans dépôt. Droits patrimoniaux cessibles, droits moraux incessibles et perpétuels.", "t": "Droit", "f": 15}, {"i": 54, "q": "Une image trouvée sur un moteur de recherche est-elle libre de droits ?", "a": "Non. Il faut vérifier la licence de chaque visuel, police et musique utilisés.", "t": "Droit", "f": 15}, {"i": 55, "q": "Que faut-il pour utiliser l'image d'une personne reconnaissable ?", "a": "Une autorisation écrite précisant les supports, la durée et le territoire d'exploitation. Pour un mineur, celle des représentants légaux.", "t": "Droit", "f": 15}, {"i": 56, "q": "Un crédit photo suffit-il à respecter le droit d'auteur ?", "a": "Non. Citer l'auteur ne remplace jamais l'autorisation d'exploitation.", "t": "Droit", "f": 15}, {"i": 57, "q": "Que définit une ligne éditoriale ?", "a": "Le ton, les thématiques, les formats, le rythme de publication, et ce qu'on ne fait jamais.", "t": "Communauté", "f": 16}, {"i": 58, "q": "Quelle est la règle en matière de modération ?", "a": "On modère les comportements, pas les opinions. Supprimer une critique légitime se retourne toujours contre la marque.", "t": "Communauté", "f": 16}, {"i": 59, "q": "Comment répondre à un avis négatif ?", "a": "Vite et publiquement : accuser réception, reconnaître ce qui est fondé, proposer une solution, puis basculer en privé.", "t": "Communauté", "f": 16}, {"i": 60, "q": "Citez quatre indicateurs d'e-réputation.", "a": "Volume de mentions, tonalité, taux d'engagement, délai moyen de réponse, part de voix, évolution des abonnés.", "t": "Communauté", "f": 16}, {"i": 61, "q": "Quelles sont les phases d'un parcours client ?", "a": "Prise de conscience → recherche et considération → décision et achat → réception et usage → après-vente → fidélisation et recommandation.", "t": "Parcours", "f": 17}, {"i": 62, "q": "Qu'est-ce qu'un point de friction ?", "a": "Un endroit du parcours où le client abandonne, attend, hésite ou s'agace.", "t": "Parcours", "f": 17}, {"i": 63, "q": "Qu'est-ce qu'un moment de vérité ?", "a": "Le point de contact qui décide de la relation — en livraison de repas, la réception de la première commande.", "t": "Parcours", "f": 17}, {"i": 64, "q": "Citez cinq formats de questions d'enquête.", "a": "Fermée dichotomique, choix unique, choix multiple, échelle de Likert, échelle de notation, NPS, ouverte.", "t": "Enquête", "f": 18}, {"i": 65, "q": "Qu'est-ce qu'une échelle de Likert ?", "a": "Une échelle d'accord en 4 à 7 niveaux, de « pas du tout d'accord » à « tout à fait d'accord ».", "t": "Enquête", "f": 18}, {"i": 66, "q": "Qu'est-ce que l'ordre en entonnoir ?", "a": "Aller du général au particulier, placer les questions signalétiques à la fin et les questions sensibles au milieu.", "t": "Enquête", "f": 18}, {"i": 67, "q": "Quelles formulations sont à bannir dans un questionnaire ?", "a": "La question à double sens, la question orientée, le vocabulaire technique, la double négation.", "t": "Enquête", "f": 18}, {"i": 68, "q": "Qu'est-ce que la méthode des quotas ?", "a": "Reproduire dans l'échantillon les proportions réelles des segments de la population.", "t": "Enquête", "f": 18}, {"i": 69, "q": "Pourquoi un panel de commentateurs en ligne est-il biaisé ?", "a": "Biais de sélection : ceux qui s'expriment spontanément sont surreprésentés aux extrêmes, très satisfaits ou très mécontents.", "t": "Enquête", "f": 18}, {"i": 70, "q": "Quel graphique pour comparer des catégories ?", "a": "Des barres.", "t": "Dataviz", "f": 19}, {"i": 71, "q": "Quel graphique pour suivre une évolution dans le temps ?", "a": "Une courbe.", "t": "Dataviz", "f": 19}, {"i": 72, "q": "Quel graphique pour situer par rapport à une cible ?", "a": "Une jauge.", "t": "Dataviz", "f": 19}, {"i": 73, "q": "Que doit donner un tableau de bord en un coup d'œil ?", "a": "L'objectif, le réalisé, l'écart, la tendance.", "t": "Dataviz", "f": 19}, {"i": 74, "q": "Combien d'indicateurs au maximum dans un tableau de bord ?", "a": "Six à huit. Au-delà, il ne sert plus à décider.", "t": "Dataviz", "f": 19}, {"i": 75, "q": "Quelle est la chaîne d'une analyse d'écarts ?", "a": "Constat chiffré → écart mesuré → cause probable → action corrective → effet attendu → coût et délai.", "t": "Pilotage", "f": 20}, {"i": 76, "q": "Que contient une préconisation opérationnelle ?", "a": "Quoi, qui, quand, avec quels moyens, pour quel coût.", "t": "Pilotage", "f": 20}, {"i": 77, "q": "Que faire face à une donnée manifestement aberrante ?", "a": "Signaler l'incohérence, poser une hypothèse de travail explicite, et poursuivre le raisonnement dessus.", "t": "Pilotage", "f": 20}, {"i": 78, "q": "Que signifie RACI ?", "a": "Responsable (exécute), Approbateur (valide, un seul), Consulté (avis avant), Informé (au courant après).", "t": "Projet", "f": 21}, {"i": 79, "q": "Comment construit-on un rétroplanning ?", "a": "On part de la date finale et on remonte : étapes, durées, dépendances, jalons, marge.", "t": "Projet", "f": 21}, {"i": 80, "q": "Qu'est-ce qu'un jalon ?", "a": "Un point de validation formelle, avec un livrable identifié et un valideur nommé.", "t": "Projet", "f": 21}, {"i": 81, "q": "Quels sont les quatre traitements possibles d'un risque ?", "a": "Éviter, réduire, transférer, accepter.", "t": "Projet", "f": 21}, {"i": 82, "q": "Comment formule-t-on un objectif pédagogique ?", "a": "Avec un verbe d'action observable : « être capable de configurer… », pas « comprendre… ».", "t": "Formation", "f": 22}, {"i": 83, "q": "Quelle différence entre évaluation à chaud et à froid ?", "a": "À chaud : la satisfaction juste après. À froid : les acquis réellement transférés, quelques semaines plus tard.", "t": "Formation", "f": 22}];
  var QCM = [{"q": "Un objectif est SMART s'il est notamment…", "o": ["Ambitieux et motivant", "Mesurable et daté", "Validé par la direction", "Formulé en une phrase courte"], "c": 1, "e": "Le M et le T imposent une cible chiffrée et une échéance."}, {"q": "« Organiser trois webinaires » est…", "o": ["Un objectif SMART", "Une action, pas un objectif", "Un KPI", "Un axe stratégique"], "c": 1, "e": "C'est un moyen. L'objectif serait le résultat attendu de ces webinaires."}, {"q": "La croissance de 7,4 % du marché des parcs est, pour Bellewaerde…", "o": ["Une force", "Une opportunité", "Une faiblesse", "Un axe stratégique"], "c": 1, "e": "Elle est extérieure à l'organisation : c'est une opportunité."}, {"q": "Le parc animalier intégré de Bellewaerde est…", "o": ["Une opportunité", "Une force", "Une menace", "Un différenciateur externe"], "c": 1, "e": "Il appartient à l'entreprise : c'est une force interne."}, {"q": "Dans un appel d'offres, annoncer les critères de sélection à l'avance relève…", "o": ["Du droit du travail", "Du droit de la concurrence", "Du RGPD", "Du droit d'auteur"], "c": 1, "e": "C'est l'égalité de traitement entre candidats."}, {"q": "Le consentement RGPD doit être…", "o": ["Écrit et signé", "Libre, spécifique, éclairé, univoque", "Renouvelé chaque mois", "Donné par téléphone"], "c": 1, "e": "D'où la case à cocher non pré-cochée."}, {"q": "Des données pseudonymisées…", "o": ["Sortent du RGPD", "Restent soumises au RGPD", "Ne peuvent plus être utilisées", "Sont anonymes"], "c": 1, "e": "La réidentification reste possible via une clé."}, {"q": "Le NPS se calcule…", "o": ["Moyenne des notes", "% promoteurs − % détracteurs", "Somme des notes ÷ répondants", "% de satisfaits"], "c": 1, "e": "Les passifs, notes 7 et 8, sont ignorés."}, {"q": "Le nombre d'abonnés est un bon KPI si l'objectif est…", "o": ["De vendre", "De développer la notoriété", "De fidéliser", "De réduire les coûts"], "c": 1, "e": "Ailleurs, c'est un indicateur de vanité."}, {"q": "Dans un budget marketing, le poste le plus souvent oublié est…", "o": ["L'impression", "Les déplacements", "Le temps humain", "Les licences logicielles"], "c": 2, "e": "C'est pourtant presque toujours le premier poste de coût."}, {"q": "Un cahier des charges doit décrire…", "o": ["La solution technique retenue", "Le besoin à satisfaire", "Le prix maximal accepté", "Le planning du prestataire"], "c": 1, "e": "Décrire la solution empêche les candidats de proposer mieux."}, {"q": "Dans la méthode CAB, le B désigne…", "o": ["Le budget", "Le bénéfice pour cet interlocuteur", "La base légale", "Le besoin exprimé"], "c": 1, "e": "Caractéristique → Avantage → Bénéfice."}, {"q": "Face à une objection, la première chose à faire est…", "o": ["Répondre avec une preuve", "Écouter sans couper", "Proposer une remise", "Changer de sujet"], "c": 1, "e": "Puis reformuler, isoler, répondre, verrouiller."}, {"q": "Accorder une remise sans contrepartie…", "o": ["Accélère la signature", "Affaiblit la position de négociation", "Est recommandé en BtoB", "Relève du droit commercial"], "c": 1, "e": "Toute concession appelle une contrepartie."}, {"q": "L'accessibilité concerne…", "o": ["La représentation de la diversité", "La possibilité effective d'utiliser", "Le prix des prestations", "La couverture géographique"], "c": 1, "e": "La représentation, c'est l'inclusion : les deux sont demandées."}, {"q": "Créditer l'auteur d'une photo…", "o": ["Suffit à respecter le droit d'auteur", "Ne remplace pas l'autorisation d'exploitation", "Dispense du droit à l'image", "Est facultatif"], "c": 1, "e": "Il faut vérifier la licence d'exploitation."}, {"q": "En modération de communauté, on modère…", "o": ["Les opinions négatives", "Les comportements", "Les concurrents", "Les avis en dessous de 3 étoiles"], "c": 1, "e": "Supprimer une critique légitime se retourne contre la marque."}, {"q": "Un point de friction est…", "o": ["Un point de contact digital", "Un endroit où le client abandonne ou s'agace", "Un canal de distribution", "Un indicateur de performance"], "c": 1, "e": "C'est le cœur du diagnostic de parcours client."}, {"q": "Interroger uniquement ceux qui ont laissé un avis en ligne produit…", "o": ["Un échantillon représentatif", "Un biais de sélection", "Un panel de quotas", "Une étude qualitative"], "c": 1, "e": "Ils sont surreprésentés aux extrêmes."}, {"q": "Pour montrer l'atteinte d'un objectif, on utilise…", "o": ["Un nuage de points", "Une jauge", "Un histogramme empilé", "Un diagramme de Gantt"], "c": 1, "e": "Objectif, réalisé, écart en un coup d'œil."}, {"q": "Une préconisation opérationnelle contient…", "o": ["Une idée et un budget", "Quoi, qui, quand, quels moyens, quel coût", "Une analyse d'écart", "Un objectif SMART"], "c": 1, "e": "Sans ces cinq éléments, ça reste une intention."}, {"q": "Dans un RACI, combien d'approbateurs par tâche ?", "o": ["Autant que nécessaire", "Un seul", "Deux minimum", "Aucun"], "c": 1, "e": "Plusieurs approbateurs, c'est une décision qui n'arrive jamais."}, {"q": "Un rétroplanning se construit…", "o": ["De la date de début vers la fin", "De la date finale en remontant", "Par ordre d'importance", "Par responsable"], "c": 1, "e": "C'est ce qui garantit que l'échéance est tenable."}, {"q": "Un objectif pédagogique se formule avec…", "o": ["Un verbe d'action observable", "Le verbe comprendre", "Une durée", "Un support"], "c": 0, "e": "« Être capable de configurer », pas « comprendre »."}, {"q": "Face à une donnée manifestement aberrante dans un énoncé…", "o": ["On l'ignore silencieusement", "On la signale et on pose une hypothèse", "On refait le calcul", "On l'exclut du tableau"], "c": 1, "e": "C'est valorisé ; un calcul faux sur une donnée douteuse ne l'est pas."}];

  var ALL = [];
  BLOCS.forEach(function(b){ b.qs.forEach(function(q){ q.id = b.id+"-"+q.n; q.bloc = b; ALL.push(q); }); });

  var FICHES = [{"n": 1, "t": "Objectifs SMART", "q": "B1 Q9 · B2 Q1, Q9 · B4 Q4", "c": "<p><b>Spécifique</b> (une seule chose, verbe d'action) · <b>Mesurable</b> (un chiffre, un indicateur) · <b>Atteignable</b> (les moyens existent) · <b>Réaliste</b> (cohérent avec la stratégie) · <b>Temporellement défini</b> (une date).</p><p><i>Pas SMART :</i> « Améliorer la notoriété de la H2S. »<br><i>SMART :</i> « Obtenir 30 demandes de démonstration d'écoles franciliennes entre septembre et décembre, mesurées par le formulaire dédié. »</p><p class='piege'><b>Le piège :</b> confondre l'objectif et l'action. « Organiser un webinaire » est une action ; « générer 40 leads qualifiés via un webinaire d'ici fin octobre » est un objectif.</p>"}, {"n": 2, "t": "La veille", "q": "B1 Q1, Q2, Q3", "c": "<p>Surveiller son environnement de façon organisée et continue pour anticiper au lieu de subir.</p><p><b>Les six types :</b> marketing (attentes clients, offres concurrentes) · commerciale (prix, canaux, fournisseurs) · technologique (outils, innovations) · réglementaire (lois, normes) · tendances comportementales (usages, valeurs) · RSE (pratiques durables, labels).</p><p><b>Le cycle :</b> définir objectifs et périmètre → collecter → analyser et trier → diffuser sous forme exploitable.</p><p><b>Fiabilité d'une source :</b> qui publie, avec quel intérêt, à quelle date, et l'information est-elle recoupée. Une source primaire prime sur une source secondaire.</p><p class='piege'><b>Le piège :</b> confondre veille et recherche ponctuelle. La veille est récurrente : fréquence, livrable, destinataire.</p>"}, {"n": 3, "t": "Segmentation, ciblage, positionnement", "q": "B1 Q5, Q6, Q7 · B2 Q2", "c": "<p>Je découpe le marché, je choisis où j'y vais, je définis comment je veux être perçu.</p><p><b>Les quatre familles de critères :</b> sociodémographiques (âge, revenu, CSP, foyer) · géographiques (zone, distance) · psychographiques (valeurs, style de vie) · comportementaux (fréquence, panier, fidélité, bénéfice recherché).</p><p><b>Un bon segment</b> est mesurable, accessible, substantiel, différencié, actionnable.</p><p><b>Trois stratégies de ciblage :</b> indifférenciée, différenciée, concentrée.</p><p><b>Formuler un positionnement :</b> <i>Pour [cible], [marque] est le [catégorie] qui [bénéfice différenciant], parce que [preuve].</i></p><p class='piege'><b>Le piège :</b> segmenter sur un seul critère. « Les familles » n'est pas un segment ; « les familles avec enfants de 4 à 12 ans, à moins de 150 km, cherchant un séjour court clé en main » en est un.</p>"}, {"n": 4, "t": "Les personas", "q": "B1 Q5 · B2 Q2", "c": "<p>Un personnage fictif mais réaliste qui incarne un segment.</p><p><b>À produire :</b> prénom et âge, situation, zone, comportement (habitudes, budget, canaux), <b>motivations</b>, <b>freins</b>, et une phrase à la première personne.</p><p><b>En BtoB, deux personas :</b> le décideur (signe, veut sécuriser et justifier l'investissement) et l'utilisateur final (s'en sert, veut simplicité et performance).</p><p><b>Le centre de décision :</b> prescripteur, décideur, acheteur, utilisateur, filtre.</p><p class='piege'><b>Le piège :</b> la fiche d'identité sans besoin. Sans motivation ni frein, un persona n'est pas exploitable.</p>"}, {"n": 5, "t": "SWOT et PESTEL", "q": "B1 Q3", "c": "<p><b>SWOT :</b> Forces et Faiblesses sont internes ; Opportunités et Menaces sont externes — elles existent qu'on le veuille ou non.</p><p><b>PESTEL</b> garantit de ne rien oublier côté externe : Politique, Économique, Socioculturel, Technologique, Écologique, Légal.</p><p><b>À produire :</b> le fait sourcé, puis son impact concret sur la stratégie.</p><p class='piege'><b>Le piège :</b> classer en opportunité ce qui est une force. Le parc animalier est une force ; la croissance du marché est une opportunité.</p>"}, {"n": 6, "t": "Le mix marketing", "q": "B1 Q10", "c": "<p><b>Les 4P :</b> Produit (offre, gamme, services) · Prix (niveau, structure, promotions) · Place (canaux, logistique) · Promotion (messages, canaux, calendrier).</p><p><b>Les 3P des services :</b> Personnel (accueil, formation) · Processus (parcours, réservation) · Preuve physique (décor, signalétique, ambiance).</p><p><b>Fixer un prix :</b> par les coûts (revient + marge), par la demande (consentement à payer), par la concurrence (alignement, pénétration, écrémage).</p><p class='piege'><b>Le piège :</b> un mix qui ne découle pas du positionnement. Premium écoresponsable + prix bas = incohérence immédiatement visible.</p>"}, {"n": 7, "t": "Le RGPD", "q": "B1 Q4 · B3 Q3, Q4, Q7", "c": "<p><b>Les principes :</b> base légale (consentement, contrat, obligation légale, intérêt légitime) · finalité déterminée · minimisation · durée limitée · sécurité · droits des personnes (accès, rectification, effacement, opposition, portabilité).</p><p><b>Le consentement</b> doit être libre, spécifique, éclairé et univoque : case non pré-cochée.</p><p><b>Cookies et traceurs</b> (analytics, heatmaps) : consentement préalable, refus aussi simple que l'acceptation.</p><p><b>Anonymisation</b> : réidentification impossible, sortie du RGPD. <b>Pseudonymisation</b> : réidentification possible via une clé, RGPD applicable.</p><p class='piege'><b>Le piège :</b> écrire « nous respectons le RGPD » sans nommer une mesure concrète.</p>"}, {"n": 8, "t": "Les KPI", "q": "B2 Q5, Q10 · B3 Q7 · B4 Q6", "c": "<p>Un KPI n'existe que par rapport à un objectif.</p><p><b>Trois niveaux :</b> moyens (ce qu'on déploie) · résultats (ce qu'on obtient) · impact (l'effet réel).</p><p><b>Un KPI bien posé :</b> nom, formule, source de données, fréquence de relevé, valeur cible.</p><p><b>Formules utiles :</b> conversion = clients ÷ visiteurs · panier moyen = CA ÷ commandes · engagement = interactions ÷ portée · NPS = % promoteurs (9-10) − % détracteurs (0-6) · ROI = (gain − coût) ÷ coût · ROAS = CA ÷ dépense pub · coût par lead = budget ÷ leads · réachat = clients ≥ 2 achats ÷ total.</p><p class='piege'><b>Le piège :</b> l'indicateur de vanité. Le nombre d'abonnés ne mesure rien si l'objectif est de vendre.</p>"}, {"n": 9, "t": "Le budget marketing", "q": "B2 Q4, Q10 · B3 Q9", "c": "<p><b>À produire :</b> un tableau poste / quantité / coût unitaire / total, puis sous-totaux et total général.</p><p><b>Trois familles de ressources :</b> humaines (jours-homme × coût journalier) · techniques (matériel, logiciels, licences) · financières (achat d'espace, impression, déplacements).</p><p>Prévoir 5 à 10 % d'imprévus, et vérifier que le total tient dans l'enveloppe annoncée.</p><p class='piege'><b>Le piège :</b> oublier le temps humain — presque toujours le premier poste de coût.</p>"}, {"n": 10, "t": "Cahier des charges et appel d'offres", "q": "B2 Q6", "c": "<p>Le cahier des charges décrit <b>le besoin</b>, pas la solution.</p><p><b>Structure :</b> présentation et contexte → objectifs → description du besoin (périmètre inclus et exclu) → exigences (techniques, qualité, RSE) → contraintes (échéancier, budget, normes) → livrables et critères d'acceptation → modalités de réponse → conditions contractuelles.</p><p><b>Obligation de moyens</b> (tout mettre en œuvre) vs <b>de résultat</b> (s'engager sur le résultat) : à choisir explicitement.</p><p><b>Clauses :</b> objet, durée, prix et paiement, propriété intellectuelle, confidentialité, responsabilité et assurances, pénalités, résiliation, droit applicable.</p><p><b>Droit de la concurrence :</b> égalité de traitement, mêmes informations, mêmes délais, critères annoncés à l'avance.</p><p class='piege'><b>Le piège :</b> décrire la solution technique, ce qui empêche les candidats de proposer mieux.</p>"}, {"n": 11, "t": "Grille d'évaluation des prestataires", "q": "B2 Q7", "c": "<p><b>À produire :</b> critères en lignes, pondération (total 100), note de chaque candidat, total pondéré, classement.</p><p><b>Familles de critères :</b> couverture du marché, capacité logistique, réputation et références, historique de performance, pratiques RSE, adéquation des compétences, prix, qualité de la réponse.</p><p class='piege'><b>Le piège :</b> une grille où le prix pèse 60 %, ce qui contredit un positionnement premium. La pondération doit refléter la stratégie.</p>"}, {"n": 12, "t": "La négociation", "q": "B2 Q8", "c": "<p><b>Avant :</b> définir l'objectif cible, l'objectif plancher, et la solution de repli. La zone d'accord possible est l'espace entre les deux planchers.</p><p><b>Structure du plan :</b> objectifs chiffrés → arguments hiérarchisés → concessions et leurs contreparties → objections anticipées et réponses.</p><p><b>Méthode CAB :</b> Caractéristique (le fait) → Avantage (ce que ça permet) → Bénéfice (pour cet interlocuteur précis).</p><p><b>Traiter une objection :</b> écouter sans couper → reformuler → isoler → répondre avec une preuve → verrouiller.</p><p><b>Règle d'or :</b> toute concession appelle une contrepartie.</p><p class='piege'><b>Le piège :</b> négocier uniquement sur le prix. Durée, volume, délais, formation, garantie, exclusivité sont des variables.</p>"}, {"n": 13, "t": "Le plan de communication", "q": "B2 Q9, Q10", "c": "<p><b>Six questions :</b> quels objectifs, quelles cibles, quels messages clés, quels canaux, quel calendrier, quel budget.</p><p><b>Trois niveaux d'objectifs :</b> cognitif (faire connaître), affectif (faire aimer), conatif (faire agir).</p><p><b>Structure d'un message :</b> accroche → promesse → preuve → appel à l'action.</p><p><b>Media</b> (achat d'espace) vs <b>hors media</b> (relations presse, événementiel, marketing direct, partenariats).</p><p class='piege'><b>Le piège :</b> parler du produit au lieu du bénéfice. « 23 capteurs » n'intéresse personne ; « une machine que vos étudiants utilisent sans surveillance » intéresse un directeur des études.</p>"}, {"n": 14, "t": "Inclusion et accessibilité", "q": "B1 Q7 · B2 Q9, Q11 · B4 Q2, Q5", "c": "<p><b>L'inclusion</b> porte sur la représentation : montrer la diversité réelle des publics (âges, genres, origines, morphologies, handicap, configurations familiales), sans stéréotypes.</p><p><b>L'accessibilité</b> porte sur l'usage effectif :<br>· <i>Visuel</i> — contraste, taille de texte, information jamais portée par la couleur seule, texte alternatif<br>· <i>Auditif</i> — sous-titres, transcription, boucle magnétique<br>· <i>Moteur</i> — circulation, hauteurs, navigation clavier<br>· <i>Cognitif</i> — langage clair, structure prévisible, pictogrammes<br>· <i>Économique</i> — gamme de prix, tarifs adaptés</p><p class='piege'><b>Le piège :</b> un paragraphe décoratif ajouté à la fin. L'inclusion doit apparaître dans la conception elle-même.</p>"}, {"n": 15, "t": "Droit d'auteur et droit à l'image", "q": "B2 Q11", "c": "<p><b>Le droit d'auteur</b> protège toute création originale dès sa création, sans dépôt. Droits patrimoniaux (cessibles) et droits moraux (incessibles, perpétuels).</p><p><b>En pratique :</b> vérifier la licence de chaque visuel, police et musique. Les licences libres imposent leurs conditions (attribution, usage commercial, modification). Une image trouvée par un moteur de recherche n'est pas libre de droits.</p><p><b>Le droit à l'image :</b> autorisation écrite précisant supports, durée et territoire. Pour un mineur, celle des représentants légaux.</p><p class='piege'><b>Le piège :</b> croire qu'un crédit photo suffit. Citer l'auteur ne remplace pas l'autorisation d'exploitation.</p>"}, {"n": 16, "t": "Communauté, modération, e-réputation", "q": "B2 Q12, Q13", "c": "<p><b>La ligne éditoriale</b> définit le ton, les thématiques, les formats, le rythme, et ce qu'on ne fait jamais.</p><p><b>Leviers d'engagement :</b> sondages, questions ouvertes, jeux-concours, sessions de questions-réponses en direct, contenus générés par les membres, mise en avant de membres, défis, coulisses.</p><p><b>La modération</b> combine charte affichée, filtres automatiques, modération humaine, escalade et droit de réponse. <b>Règle :</b> on modère les comportements, pas les opinions.</p><p><b>Répondre à un avis négatif :</b> vite et publiquement — accuser réception, reconnaître ce qui est fondé, proposer une solution, basculer en privé.</p><p><b>Indicateurs :</b> volume de mentions, tonalité, engagement, délai de réponse, part de voix, évolution des abonnés.</p><p class='piege'><b>Le piège :</b> confondre modération et censure. Le critère demande un environnement positif, pas un environnement sans critique.</p>"}, {"n": 17, "t": "La cartographie du parcours client", "q": "B3 Q1", "c": "<p><b>Les phases :</b> prise de conscience → recherche et considération → décision et achat → réception et usage → après-vente → fidélisation et recommandation.</p><p><b>Par phase :</b> actions du client, points de contact, outils côté entreprise, émotion ressentie, points de friction, pistes d'amélioration.</p><p><b>Point de contact :</b> tout moment de rencontre avec la marque. <b>Point de friction :</b> là où le client abandonne, attend, hésite ou s'agace. <b>Moment de vérité :</b> le point qui décide de la relation.</p><p class='piege'><b>Le piège :</b> s'arrêter à l'achat. La consigne dit « de la découverte à la fidélisation ».</p>"}, {"n": 18, "t": "L'enquête de satisfaction", "q": "B3 Q4, Q5, Q6", "c": "<p><b>Types de questions :</b> fermée dichotomique, choix unique, choix multiple, échelle de Likert (4 à 7 niveaux), échelle de notation, NPS, ouverte.</p><p><b>Ordre en entonnoir :</b> du général au particulier ; signalétique à la fin, questions sensibles au milieu.</p><p><b>À bannir :</b> la question à double sens, la question orientée, le vocabulaire technique, la double négation.</p><p><b>Échantillonnage :</b> un échantillon représentatif reproduit la structure de la population (méthode des quotas). Un échantillon de volontaires est biaisé : surreprésentation des extrêmes.</p><p><b>Administration :</b> canal, déclencheur, moment, relances, incitation. Au-delà de 10 minutes, le taux de réponse s'effondre.</p><p class='piege'><b>Le piège :</b> ne pas dire ce qu'on fera des résultats. Le critère demande l'exploitation pour la décision.</p>"}, {"n": 19, "t": "Tableau de bord et visualisation", "q": "B3 Q8", "c": "<p>Un tableau de bord donne en un coup d'œil : l'objectif, le réalisé, l'écart, la tendance.</p><p><b>Le bon graphique :</b> comparer des catégories → barres · évolution dans le temps → courbe · répartition → secteurs (5 parts maximum) ou barres empilées · situer face à une cible → jauge · croiser deux variables → nuage de points.</p><p><b>Règles :</b> un message par graphique ; un titre qui énonce la conclusion (« Lyon décroche sur la conversion ») plutôt que le contenu ; code couleur constant ; axe partant de zéro pour les barres.</p><p class='piege'><b>Le piège :</b> empiler tous les indicateurs. Au-delà de 6 à 8, le tableau ne sert plus à décider.</p>"}, {"n": 20, "t": "L'analyse d'écarts", "q": "B3 Q9", "c": "<p><b>La chaîne :</b> constat chiffré → écart mesuré (valeur et pourcentage) → cause probable → action corrective → effet attendu → coût et délai.</p><p><b>Une préconisation opérationnelle :</b> quoi, qui, quand, avec quels moyens, pour quel coût. Sans ces cinq éléments, c'est une intention.</p><p><b>Donnée aberrante :</b> signaler l'incohérence, poser une hypothèse explicite, poursuivre dessus. C'est valorisé ; un calcul faux sur une donnée douteuse ne l'est pas.</p><p class='piege'><b>Le piège :</b> confondre corrélation et causalité. Le lien s'argumente, il ne se suppose pas.</p>"}, {"n": 21, "t": "Coordination d'équipe et rétroplanning", "q": "B4 Q1, Q3, Q5, Q7, Q8", "c": "<p><b>Matrice RACI :</b> Responsable (exécute) · Approbateur (valide, un seul par tâche) · Consulté (avis avant) · Informé (au courant après).</p><p><b>Rétroplanning :</b> partir de la date finale et remonter — étapes, durées, dépendances, jalons, marge. Un <b>jalon</b> est un point de validation formelle avec un livrable et un valideur nommé.</p><p><b>Analyse de risque :</b> probabilité, impact, puis traitement — éviter, réduire, transférer, accepter.</p><p><b>Rituels :</b> point court régulier, revue de livrables aux jalons, rétrospective finale. Ils ne valent que s'ils ont un ordre du jour et une décision en sortie.</p><p class='piege'><b>Le piège :</b> un rétroplanning sans responsable nommé par étape — le critère l'exige explicitement.</p>"}, {"n": 22, "t": "Former et évaluer", "q": "B4 Q10, Q11", "c": "<p><b>Analyse du besoin :</b> comparer compétences requises et compétences disponibles. L'écart définit le contenu.</p><p><b>Construire une session :</b> objectifs pédagogiques en verbes d'action observables (« être capable de configurer », pas « comprendre ») → séquençage en modules avec alternance théorie et pratique → supports (présentation, guide écrit, tutoriel vidéo, fiche mémo) → modalités → évaluation à chaud (satisfaction) et à froid (acquis transférés).</p><p><b>Bonnes pratiques :</b> partir de l'existant des participants, changer de format toutes les 20 minutes, faire manipuler tôt, illustrer par des cas réels, fournir un support à emporter.</p><p class='piege'><b>Le piège :</b> décrire un contenu sans dire comment on vérifie qu'il a été acquis.</p>"}];

  var S = { status:{}, checks:{}, notes:{}, fiche:{}, journal:[], box:{}, due:{}, quiz:[],
            deadline:DEFAULT_DEADLINE, open:{b1:true}, view:"accueil" };
  var SES=null, QZ=null, saveTimer=null;
  var main = document.getElementById("main");
  var nav  = document.getElementById("nav");

  var MEM = {};
  var Store = {
    get: async function(k){
      try { if(window.storage && window.storage.get) return await window.storage.get(k); } catch(e){}
      return MEM[k] ? {key:k, value:MEM[k]} : null;
    },
    set: async function(k,v){
      try { if(window.storage && window.storage.set) return await window.storage.set(k,v); } catch(e){}
      MEM[k]=v; return {key:k,value:v};
    }
  };
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ try{ Store.set(KEY, JSON.stringify(S)); }catch(e){} }, 300);
  }
  function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function weeksLeft(){ return Math.max(0,(new Date(S.deadline+"T00:00:00") - new Date())/(1000*60*60*24*7)); }
  function expectedDone(){
    var d=new Date(S.deadline+"T00:00:00");
    var total=(d-START)/86400000, gone=(new Date()-START)/86400000;
    if(total<=0) return ALL.length;
    return Math.round(ALL.length*Math.min(1,Math.max(0,gone/total)));
  }
  function isDone(id){ var s=S.status[id]; return s==="draft"||s==="done"; }
  function doneCount(){ return ALL.filter(function(q){return isDone(q.id);}).length; }

  var INTERV=[0,1,2,4,8,16];
  function today(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); }
  function dueNow(i){ var b=S.box[i]||0; return b===0 ? true : (S.due[i]||0)<=today(); }
  function dueCount(){ return CARDS.filter(function(c){return dueNow(c.i);}).length; }
  function grade(i,ok){ var b=S.box[i]||0, nb=ok?Math.min(5,b+1):1; S.box[i]=nb; S.due[i]=today()+INTERV[nb]*86400000; save(); }
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;} return a; }

  var VIEWS=[["accueil","Accueil"],["dossiers","Dossiers"],["reviser","Réviser"],["quiz","Quiz"],["memo","Mémo"]];

  function go(v){
    if(v!==S.view){ SES=null; QZ=null; }
    S.view=v; save();
    if(location.hash!=="#"+v) location.hash=v;
    render();
    window.scrollTo(0,0);
  }

  function renderNav(){
    var h="";
    VIEWS.forEach(function(v){
      var badge="";
      if(v[0]==="dossiers"){ var r=ALL.length-doneCount(); if(r) badge='<i>'+r+'</i>'; }
      if(v[0]==="reviser"){ var d=dueCount(); if(d) badge='<i>'+d+'</i>'; }
      h+='<button class="navb'+(S.view===v[0]?" on":"")+'" data-go="'+v[0]+'">'+v[1]+badge+'</button>';
    });
    nav.innerHTML=h;
    nav.querySelectorAll("[data-go]").forEach(function(el){
      el.addEventListener("click",function(){ go(el.getAttribute("data-go")); });
    });
  }

  /* ---------- ACCUEIL ---------- */
  function vAccueil(){
    var done=doneCount(), left=ALL.length-done, wl=weeksLeft();
    var pace= wl>0.15 ? left/wl : left;
    var exp=expectedDone(), delta=done-exp;
    var verdict,cls;
    if(left===0){verdict="Tout est déposé.";cls="ok";}
    else if(delta>=0){verdict="Tu es dans les temps.";cls="ok";}
    else {verdict=Math.abs(delta)+" livrable"+(Math.abs(delta)>1?"s":"")+" de retard.";cls="late";}

    var h='<div class="cadence"><div class="verdict '+cls+'">'+verdict+'</div>';
    h+='<div class="sub">Rythme nécessaire pour tenir la date : <strong>'+pace.toFixed(1)+' livrable'+(pace>=2?'s':'')+' par semaine</strong>.</div>';
    h+='<div class="ticks">';
    ALL.forEach(function(q,i){
      var st=S.status[q.id], c=isDone(q.id)?"done":(st==="wip"?"wip":"");
      if(i===exp&&left>0) c+=" mark";
      h+='<div class="tick '+c+'" title="'+q.bloc.code+' '+q.n+'"></div>';
    });
    h+='</div><div class="legend"><span><i class="dot" style="background:var(--signal)"></i>rédigé</span><span><i class="dot" style="background:#9AA8E8"></i>en cours</span><span><i class="dot" style="background:#D5D9D0"></i>à faire</span><span><i class="dot" style="background:var(--alert);width:2px;height:11px"></i>où tu devrais en être</span></div>';
    h+='<div class="stats"><div class="stat"><div class="num">'+done+'<span class="on">/'+ALL.length+'</span></div><div class="lbl">Terminés</div></div>';
    h+='<div class="stat"><div class="num">'+Math.floor(wl)+'</div><div class="lbl">Semaines restantes</div></div>';
    h+='<div class="stat"><div class="num">'+left+'</div><div class="lbl">Restants</div></div></div></div>';

    var nxt=ALL.filter(function(q){return !isDone(q.id);})[0];
    if(nxt){
      h+='<div class="next"><div class="eyebrow">La prochaine chose à faire</div>';
      h+='<div class="t">'+nxt.bloc.code+' · '+nxt.n+' — '+nxt.t+'</div>';
      h+='<button data-jump="'+nxt.id+'" data-bloc="'+nxt.bloc.id+'">Ouvrir</button></div>';
    } else {
      h+='<div class="next"><div class="eyebrow">Terminé</div><div class="t">Les 44 livrables sont rédigés.</div></div>';
    }

    var d=dueCount(), maitr=CARDS.filter(function(c){return (S.box[c.i]||0)>=4;}).length;
    h+='<div class="grid2">';
    h+='<div class="mini" data-go="reviser"><div class="eyebrow">Révision</div><div class="bignum">'+d+'</div><div class="lbl">carte'+(d>1?'s':'')+' à revoir</div></div>';
    h+='<div class="mini" data-go="reviser"><div class="eyebrow">Acquis</div><div class="bignum">'+maitr+'<span class="on">/'+CARDS.length+'</span></div><div class="lbl">notions maîtrisées</div></div>';
    h+='</div>';

    h+='<div class="foot">Date limite de dépôt : <input type="date" id="dl" value="'+S.deadline+'"><br>';
    h+='Tes données sont enregistrées automatiquement et te suivent d\'un appareil à l\'autre.<br>';
    h+='<button id="exp">Exporter tout en texte</button>';
    h+='<textarea class="f" id="expbox" style="display:none;margin-top:8px;min-height:220px;font-size:12px"></textarea></div>';
    return h;
  }

  /* ---------- DOSSIERS ---------- */
  function vDossiers(){
    var h='';
    var fOpen=S.open.fiche?" open":"";
    var fFilled=FICHE_B1.filter(function(f){return (S.fiche[f[0]]||"").trim();}).length;
    h+='<section class="panel accent'+fOpen+'"><button class="phead" data-panel="fiche"><span class="chev">&#9654;</span>';
    h+='<h2>Fiche de cohérence — Bloc 1<span class="cas">Tes décisions structurantes. À relire au début de chaque session.</span></h2>';
    h+='<span class="count">'+fFilled+'/'+FICHE_B1.length+'</span></button><div class="pbody fiche">';
    FICHE_B1.forEach(function(f){
      h+='<div class="row"><div class="k"><span>'+f[1]+'</span><em>'+f[2]+'</em></div>';
      h+='<textarea class="f" data-fiche="'+f[0]+'" placeholder="—">'+esc(S.fiche[f[0]])+'</textarea></div>';
    });
    h+='<div class="given"><b>Donné par l\'énoncé, non négociable :</b> budget 18 à 21 M€ dont 1 M€ communication et lancement · ouverture printemps N+3 · +15 % de CA global en 3 ans · 100 chambres dont 8 PMR minimum · 70 % de circuits courts.</div></div></section>';

    var jOpen=S.open.journal?" open":"";
    h+='<section class="panel accent'+jOpen+'"><button class="phead" data-panel="journal"><span class="chev">&#9654;</span>';
    h+='<h2>Journal d\'arbitrages<span class="cas">Trois lignes après chaque session. C\'est le script de ta vidéo.</span></h2>';
    h+='<span class="count">'+S.journal.length+'</span></button><div class="pbody"><div class="jform">';
    h+='<input class="f" id="j-q" placeholder="Question concernée — ex. Bloc 1 · Q5">';
    h+='<textarea class="f" id="j-in" placeholder="Ce que j\'ai retenu"></textarea>';
    h+='<textarea class="f" id="j-out" placeholder="Ce que j\'ai écarté"></textarea>';
    h+='<textarea class="f" id="j-why" placeholder="Pourquoi"></textarea>';
    h+='<button class="jadd" id="j-add">Ajouter au journal</button></div>';
    if(!S.journal.length) h+='<div class="empty">Rien pour l\'instant. La première entrée devrait arriver après ta session sur la question 1.</div>';
    else S.journal.slice().reverse().forEach(function(e){
      h+='<div class="jentry"><button class="del" data-del="'+e.id+'">&times;</button>';
      h+='<div class="meta">'+esc(e.date)+(e.q?' · '+esc(e.q):'')+'</div>';
      if(e.in) h+='<div><b>Retenu :</b> '+esc(e.in)+'</div>';
      if(e.out)h+='<div><b>Écarté :</b> '+esc(e.out)+'</div>';
      if(e.why)h+='<div><b>Pourquoi :</b> '+esc(e.why)+'</div>';
      h+='</div>';
    });
    h+='</div></section>';

    BLOCS.forEach(function(b){
      var bd=b.qs.filter(function(q){return isDone(q.id);}).length;
      var op=S.open[b.id]?" open":"";
      h+='<section class="panel'+op+'" id="sec-'+b.id+'"><button class="phead" data-panel="'+b.id+'"><span class="chev">&#9654;</span>';
      h+='<h2>'+b.code+' — '+b.titre+'<span class="cas">'+b.cas+'</span></h2>';
      h+='<span class="count">'+bd+'/'+b.qs.length+'</span></button><div class="qlist">';
      b.qs.forEach(function(q){
        var st=S.status[q.id]||"todo";
        var lbl=st==="done"?"relu":st==="draft"?"rédigé":st==="wip"?"en cours":"à faire";
        var chipc=st==="done"?" done":st==="draft"?" draft":st==="wip"?" wip":"";
        var qo=S.open[q.id]?" open":"";
        h+='<div class="q'+qo+'" id="q-'+q.id+'"><button class="qhead" data-q="'+q.id+'"><span class="qn">'+q.n+'</span><span class="qt">'+q.t+'</span><span class="chip'+chipc+'">'+lbl+'</span></button><div class="qbody">';
        var inf=INFO[q.id];
        if(inf){
          h+='<div class="lab">Ce qui est attendu concrètement</div><ul class="att">';
          inf[0].forEach(function(a){h+='<li>'+a+'</li>';});
          h+='</ul><details class="notions"><summary>Notions à mobiliser — '+inf[1].length+'</summary><ul>';
          inf[1].forEach(function(n){h+='<li>'+n+'</li>';});
          h+='</ul><p class="rappel">Ces notions sont détaillées dans l\'onglet Mémo. Si un point te manque, demande-le-moi.</p></details>';
        }
        if(q.trame) h+='<div class="lab">Trame détaillée</div><div class="trame">'+q.trame+'</div>';
        h+='<div class="lab">Critères évalués — compétence '+q.c+'</div>';
        q.k.forEach(function(k,i){
          var ck=(S.checks[q.id]||{})[i]?" checked":"";
          h+='<label class="crit"><input type="checkbox" data-check="'+q.id+'" data-i="'+i+'"'+ck+'><span>'+k+'</span></label>';
        });
        h+='<div class="lab">Brouillon</div><textarea class="f big" data-note="'+q.id+'" placeholder="Écris ici. Tu récupéreras tout d\'un coup depuis l\'accueil, bouton Exporter.">'+esc(S.notes[q.id])+'</textarea>';
        h+='<div class="lab">Où j\'en suis</div><div class="states">';
        [["todo","À faire"],["wip","En cours"],["draft","Rédigé"],["done","Relu"]].forEach(function(p){
          h+='<button data-set="'+q.id+'" data-v="'+p[0]+'" aria-pressed="'+(st===p[0])+'">'+p[1]+'</button>';
        });
        h+='</div></div></div>';
      });
      h+='</div></section>';
    });
    return h;
  }

  /* ---------- REVISER ---------- */
  function vReviser(){
    if(SES){
      var c=SES.list[SES.i];
      if(!c){
        return '<div class="done-msg"><b>Session terminée.</b> '+SES.ok+' sue'+(SES.ok>1?'s':'')+' sur '+SES.list.length+'.</div><button class="jadd" data-lrn="stop">Revenir</button>';
      }
      var h='<div class="prog">Carte '+(SES.i+1)+' sur '+SES.list.length+' · '+c.t+'</div><div class="card"><div class="cq">'+c.q+'</div>';
      if(SES.show){
        h+='<div class="ca">'+c.a+'</div><div class="cbtns"><button class="no" data-lrn="ko">Pas su</button><button class="yes" data-lrn="ok">Je savais</button></div>';
        h+='<div class="fref"><button class="linkf" data-fiche-go="'+c.f+'">Fiche '+c.f+' du mémo &rarr;</button></div>';
      } else h+='<button class="reveal" data-lrn="show">Voir la réponse</button>';
      h+='</div><button class="quit" data-lrn="stop">Arrêter la session</button>';
      return h;
    }
    var d=dueCount(), vus=CARDS.filter(function(c){return (S.box[c.i]||0)>0;}).length;
    var maitr=CARDS.filter(function(c){return (S.box[c.i]||0)>=4;}).length;
    var h='<div class="stats" style="margin-top:0">';
    h+='<div class="stat"><div class="num">'+d+'</div><div class="lbl">À revoir</div></div>';
    h+='<div class="stat"><div class="num">'+vus+'<span class="on">/'+CARDS.length+'</span></div><div class="lbl">Vues</div></div>';
    h+='<div class="stat"><div class="num">'+maitr+'</div><div class="lbl">Maîtrisées</div></div></div>';
    h+='<div class="lab">Session</div><div class="states">';
    h+='<button data-lrn="start"'+(d?'':' disabled')+'>'+(d?'Cartes du jour ('+d+')':'Rien à revoir aujourd\'hui')+'</button>';
    h+='<button data-lrn="startall">Tout revoir ('+CARDS.length+')</button></div>';
    h+='<div class="lab">Par thème</div><div class="states">';
    var t={}; CARDS.forEach(function(c){t[c.t]=(t[c.t]||0)+1;});
    Object.keys(t).sort().forEach(function(k){
      var dd=CARDS.filter(function(c){return c.t===k&&dueNow(c.i);}).length;
      h+='<button data-theme="'+k+'">'+k+' <em>'+t[k]+(dd?' · '+dd+' à revoir':'')+'</em></button>';
    });
    h+='</div><p class="rappel">Les cartes reviennent selon ton niveau : une carte sue réapparaît dans 2, 4, 8 puis 16 jours ; une carte ratée revient dès demain.</p>';
    return h;
  }

  /* ---------- QUIZ ---------- */
  function vQuiz(){

        var pct=Math.round(100*QZ.ok/QZ.list.length);
        var h='<div class="done-msg"><b>'+QZ.ok+' / '+QZ.list.length+'</b> — '+pct+' % de bonnes réponses.</div>';
        if(QZ.wrong.length){ h+='<div class="lab">À retravailler</div><ul class="att">'; QZ.wrong.forEach(function(w){h+='<li>'+w+'</li>';}); h+='</ul>'; }
        h+='<button class="jadd" data-lrn="qstop">Revenir</button>';
        return h;
      }
      var q=QZ.list[QZ.i];
      var h='<div class="prog">Question '+(QZ.i+1)+' sur '+QZ.list.length+' · score '+QZ.ok+'</div><div class="card"><div class="cq">'+q.q+'</div><div class="opts">';
      q.o.forEach(function(o,k){

      });
      h+='</div>';
      if(QZ.answered!==null) h+='<div class="expl">'+q.e+'</div><div class="cbtns"><button class="yes" data-lrn="qnext">Suivante</button></div>';
      h+='</div><button class="quit" data-lrn="qstop">Arrêter le quiz</button>';

      var best=S.quiz.reduce(function(a,r){var p=r.s/r.n;return p>a?p:a;},0);
      h+='<div class="stats"><div class="stat"><div class="num">'+S.quiz.length+'</div><div class="lbl">Quiz passés</div></div>';
      h+='<div class="stat"><div class="num">'+Math.round(best*100)+'<span class="on">%</span></div><div class="lbl">Meilleur score</div></div></div>';
      h+='<div class="lab">Historique</div>';

      });
